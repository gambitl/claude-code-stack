name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cstack
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cstack/package-lock.json
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "The tag is $TAG, but package.json says the tag must be $expected." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Pack
        id: pack
        run: |
          file=$(npm pack --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKED_FILE: ${{ steps.pack.outputs.file }}
        run: gh release create "$TAG" "$PACKED_FILE" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
